# Runs on every push and pull request: every module must compile, the
# procgen maths self test must report 0 failures, and the overlay and bio
# modules must import without EDMC. load.py needs EDMC and is only compiled.
name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # the interpreter EDMC 6.x ships
      - name: compile every module
        run: python -m py_compile *.py edts_pgnames/*.py regionmap/*.py
      - name: procgen self test
        run: python procgen.py
      - name: surface compass self test
        run: python surfacenav.py
      - name: mining overlay self test
        run: python miningstat.py
      - name: cockpit overlay self test
        run: python overlay.py
      - name: in-system route self test
        run: python sysroute.py
      - name: database backup self test
        run: python sysdb.py
      - name: network gateway self test (no network)
        run: python netgate.py
      - name: EDDiscovery name decoding self test
        run: python sources.py
      - name: journal reading self test
        run: python journalscan.py
      - name: probe bundle prefix self test
        run: python boxelplan.py
      - name: local-first shells self test
        run: python shells.py
      - name: local-first flow (load.py against a fake galaxy, no network)
        run: python tests/localfirst_flow.py
      - name: plugin journal hooks (load.py against a scripted session, no network)
        run: python tests/plugin_hooks.py
      - name: dispatch lint (no dead branch in a journal event chain)
        run: python tests/dispatch_lint.py
      - name: named sectors (planner and id64 names over hand-authored sectors)
        run: python tests/named_sectors.py
      - name: galaxy map list (catalogue slots, list end, EDD by id64)
        run: python tests/galaxy_list.py
      - name: UI hand-over (worker threads reach Tk only through one event)
        run: python tests/ui_threads.py
      - name: plain-python modules import without EDMC
        run: python -c "import procgen, sysdb, sysroute, boxelplan, sources, deepspace, overlay, biopredict, surfacenav, miningstat, netgate, shells, journalscan, edts_pgnames, regionmap; assert procgen._edts is not None; assert regionmap.find_region(0, 0, 0)[1] == 'Inner Orion Spur'; print('imports ok')"
      - name: FIS tests (flight information system)
        working-directory: FIS
        run: python -m unittest discover -s tests -t .
