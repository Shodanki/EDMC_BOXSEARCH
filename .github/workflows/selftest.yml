# Runs on every push and pull request: every module must compile, the
# procgen maths self test must report 0 failures, and the overlay and bio
# modules must import without EDMC. load.py needs EDMC and is only compiled.
name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # the interpreter EDMC 6.x ships
      - name: compile every module
        run: python -m py_compile *.py edts_pgnames/*.py regionmap/*.py
      - name: procgen self test
        run: python procgen.py
      - name: surface compass self test
        run: python tests/surfacenav_selftest.py
      - name: mining overlay self test
        run: python tests/miningstat_selftest.py
      - name: EDDiscovery archive self test
        run: python tests/eddhistory_selftest.py
      - name: cockpit overlay self test
        run: python tests/overlay_selftest.py
      - name: in-system route self test
        run: python tests/sysroute_selftest.py
      - name: Kepler positions against the game's DistanceFromArrivalLS (real scans, every orbit in its parent's frame)
        run: python tests/kepler_reality.py
      - name: fuel model with the ship's mass (dist * mass, per ship and mass step, FSD prior, reset)
        run: python tests/fuel_model.py
      - name: resetting a learnt model (marks in FIS/learn_reset.json, replays from the reset on)
        run: python tests/learn_reset.py
      - name: permit hint (EDD's permit list marks sphere targets, never removes them)
        run: python tests/permit_hint.py
      - name: database backup self test
        run: python tests/sysdb_selftest.py
      - name: network gateway self test (no network)
        run: python tests/netgate_selftest.py
      - name: EDDiscovery name decoding self test
        run: python tests/sources_selftest.py
      - name: journal reading self test
        run: python tests/journalscan_selftest.py
      - name: probe bundle prefix self test
        run: python tests/boxelplan_selftest.py
      - name: local-first shells self test
        run: python tests/shells_selftest.py
      - name: local-first flow (the plugin against a fake galaxy, no network)
        run: python tests/localfirst_flow.py
      - name: plugin journal hooks (the plugin against a scripted session, no network)
        run: python tests/plugin_hooks.py
      - name: dispatch lint (no dead branch in a journal event chain)
        run: python tests/dispatch_lint.py
      - name: named sectors (planner and id64 names over hand-authored sectors)
        run: python tests/named_sectors.py
      - name: galaxy map list (catalogue slots, list end, EDD by id64)
        run: python tests/galaxy_list.py
      - name: UI hand-over (worker threads reach Tk only through one event)
        run: python tests/ui_threads.py
      - name: overlay on the ground (compass stays while standing still, route steps aside)
        run: python tests/surface_overlay.py
      - name: ground mining (rigs, Rhino and ship hold, overlay and FIS alike)
        run: python tests/ground_mining.py
      - name: situation column (value formula, board, 44-character texts, plugin end to end)
        run: python tests/situation.py
      - name: settings page on tabs, fits a 1080p screen (skipped without a display)
        run: python tests/prefs_layout.py
      - name: a finished system - the full tour, or no route at all (setting)
        run: python tests/route_done.py
      - name: own overlay window (drawn on the main thread, scaled, expiry, focus)
        run: python tests/overlay_window.py
      - name: probe names at EDSM (one bundled request, budget, never twice)
        run: python tests/edsm_names.py
      - name: open bio signals (Brain Trees - one signal, several species)
        run: python tests/biosig.py
      - name: life support off (no event from the game - Loadout, ModulesInfo.json, AFMU repairs with DANGER)
        run: python tests/life_support.py
      - name: reality check from the command line (every model's row over a scripted journal)
        run: python tests/realitycheck.py
      - name: EDMC passes on no journal events (warning, missed events stored, track positions)
        run: python tests/journal_gap.py
      - name: chance of a find (FX3, kept at the first arrival, set against the scans)
        run: python tests/findodds.py
      - name: never looked-up systems asked in EDD's file by id64 (FX4, local)
        run: python tests/eddcheck.py
      - name: in-system route order at the exact optimum (RT2, five real systems)
        run: python tests/route_order.py
      - name: ai-disclosure.json names AI_TRANSPARENCY.md by its current hash (M14)
        run: python tests/ai_disclosure.py
      - name: a replayed old death takes no data gathered after it (LD1, 22.11.)
        run: python tests/lost_on_replay.py
      - name: false loss marks are taken back on start and replay (LM1, 22.11.)
        run: python tests/false_losses.py
      - name: bio display variant 1 - PLANET rows, overlay finished species, hide switch (5.1.0)
        run: python tests/bio_display.py
      - name: the FIS starts from an argument list, no shell (M11)
        run: python tests/fis_launch.py
      - name: package import (relative imports, both of EDMC's ways to load a plugin)
        run: python tests/package_import.py
      - name: code style (flake8 with EDMC's line length, see .flake8)
        run: |
          python -m pip install --quiet flake8==7.5.0   # pinned, as tested
          python -m flake8
      - name: release manifest (every shipped file with its hash, see integrity.py)
        run: python tests/manifest.py
      - name: file check at start (missing or damaged files named, the plugin still loads)
        run: python tests/integrity.py
      - name: docstrings (every module and public function says what it does)
        run: python tests/docstrings.py
      - name: complexity (EDMC's limit 15, every function of the plugin and the FIS)
        run: python tests/complexity.py
      - name: plain-python modules import without EDMC
        run: python -c "import procgen, sysdb, sysroute, boxelplan, sources, deepspace, overlay, biopredict, surfacenav, miningstat, netgate, shells, journalscan, biosig, bodyvalue, situation, groundmine, learnreset, findodds, shipstate, suittemp, lifesupport, edts_pgnames, regionmap; assert procgen._edts is not None; assert regionmap.find_region(0, 0, 0)[1] == 'Inner Orion Spur'; print('imports ok')"
      - name: FIS tests (flight information system)
        working-directory: FIS
        run: python -m unittest discover -s tests -t .
